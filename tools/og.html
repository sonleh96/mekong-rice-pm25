<!doctype html>
<!-- Social card. Render with: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=img/og.png tools/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F7F6F2; color: #141619; -webkit-font-smoothing: antialiased; }
  body { box-sizing: border-box; padding: 64px 72px; display: grid; grid-template-rows: auto 1fr auto; }
  .eyebrow { font: 500 18px/1 Monaco, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: #3F6A1E; }
  h1 { margin: 28px 0 0; font: 800 72px/1.04 "Inter", sans-serif; letter-spacing: -0.03em; max-width: 900px; }
  h1 i { display: block; font-style: normal; margin-top: 14px; font-size: 36px; font-weight: 500; color: #575D64; letter-spacing: -0.01em; }
  .foot { display: flex; align-items: end; justify-content: space-between; border-top: 1px solid #E3E1DA; padding-top: 28px; }
  .num { font: 800 64px/1 "Inter", sans-serif; letter-spacing: -0.02em; }
  .num small { font: 500 22px/1 "Inter", sans-serif; color: #575D64; margin-left: 8px; }
  .num span { display: block; margin-top: 12px; font: 400 22px/1.3 "Inter", sans-serif; color: #575D64; }
  .who { font: 400 22px/1.5 "Inter", sans-serif; color: #575D64; text-align: right; }
</style>
</head>
<body>
  <div class="eyebrow">Scientific Reports &middot; 2026</div>
  <h1>Air pollution and rice crop health<i>Evidence from Vietnam&rsquo;s Mekong Delta</i></h1>
  <div class="foot">
    <div class="num">16.5<small>&micro;g/m&sup3;</small><span>PM2.5 level where rice health starts to decline</span></div>
    <div class="who">Go, Iddawela, Le, Tan<br>Asian Development Bank</div>
  </div>
</body>
</html>
